        <tspan x="934" dy="26">智能預警架構，需要滿足即時分析、資料留存和事後</tspan>
        <tspan x="934" dy="26">追查要求，並針對園區、倉庫、辦公區進行差異化部署。</tspan>
      </text>
    </g>

