      <rect class="card" x="1240" y="928" width="500" height="60" rx="18" fill="#F9FBFF" stroke="#BDD3FB"/>
      <text class="t-body" x="1264" y="946" dominant-baseline="hanging">確定A品牌邊緣計算盒子，總預算四百一十萬。</text>
