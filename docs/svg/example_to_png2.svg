  <g id="nodes">
    <!-- center -->
    <g id="center-node">
      <rect class="halo" x="40" y="862" width="360" height="96" rx="22" stroke="#E6DFFF"/>
      <rect class="card" x="40" y="862" width="360" height="96" rx="22" fill="#FCFAFF" stroke="#D4C8FF"/>
      <text class="t-center" x="66" y="888" dominant-baseline="hanging">
        <tspan x="66" dy="0">集中式視頻監控系統升級為</tspan>
        <tspan x="66" dy="32">邊緣計算+AI智能預警方案評審</tspan>
      </text>
    </g>

    <!-- level-1 -->
    <g id="l1-background">
      <rect class="halo" x="540" y="103" width="160" height="62" rx="18" stroke="#F3D9E7"/>
      <rect class="card" x="540" y="103" width="160" height="62" rx="18" fill="#FFF8FC" stroke="#E9B8CF"/>
